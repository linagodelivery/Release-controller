name: Courier signing identity check

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-courier-sign-identity:
    name: Verify Courier signing identity
    runs-on: ubuntu-latest
    environment: courier-sign
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release-controller source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate with Google Cloud WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: deliveryapp-2b7a4
          workload_identity_provider: projects/581390628800/locations/global/workloadIdentityPools/github-release-pool/providers/github-delivery
          service_account: gha-courier-sign@deliveryapp-2b7a4.iam.gserviceaccount.com
          create_credentials_file: true
          cleanup_credentials: true

      - name: Install pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: deliveryapp-2b7a4
          version: latest

      - name: Verify authenticated service account
        shell: bash
        run: |
          set -euo pipefail
          # Force credential exchange, but never print or persist the token.
          gcloud auth print-access-token >/dev/null
          actual="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          expected='gha-courier-sign@deliveryapp-2b7a4.iam.gserviceaccount.com'
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected Google Cloud principal.' >&2
            exit 1
          fi
          echo 'Courier WIF service-account identity verified.'
