name: Courier signing boundary preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Delivery commit SHA built by the private candidate workflow
        required: true
        type: string
      build_run_id:
        description: Successful run ID from Courier unsigned release candidate in Delivery
        required: true
        type: string

permissions: {}

concurrency:
  group: courier-sign-preflight
  cancel-in-progress: false

jobs:
  signing-boundary-preflight:
    name: Verify private Courier candidate and WIF boundary (no signing)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: courier-sign
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Mint short-lived read-only Delivery artifact token
        id: delivery-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.DELIVERY_ARTIFACT_READER_APP_ID }}
          private-key: ${{ secrets.DELIVERY_ARTIFACT_READER_PRIVATE_KEY }}
          owner: linagodelivery
          repositories: Delivery
          permission-actions: read
          permission-contents: read

      - name: Check out trusted release-controller verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: release-controller

      - name: Verify source lineage, build run, and artifact identity
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ steps.delivery-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const owner = 'linagodelivery';
          const repo = 'Delivery';
          const token = process.env.GH_TOKEN;
          const sourceSha = process.env.SOURCE_SHA;
          const runId = process.env.BUILD_RUN_ID;
          if (!/^[0-9a-f]{40}$/.test(sourceSha ?? '') || !/^\d{1,20}$/.test(runId ?? '')) throw new Error('Invalid immutable source SHA or run ID.');
          async function api(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' },
            });
            if (!response.ok) throw new Error(`GitHub verification request failed (${response.status}).`);
            return response.json();
          }
          const run = await api(`/repos/${owner}/${repo}/actions/runs/${runId}`);
          const expectedPath = '.github/workflows/courier-unsigned-release-candidate.yml';
          if (run.repository?.full_name !== `${owner}/${repo}` || run.head_repository?.full_name !== `${owner}/${repo}` ||
              run.event !== 'workflow_dispatch' || run.head_branch !== 'main' || run.status !== 'completed' || run.conclusion !== 'success' ||
              run.path?.split('@')[0] !== expectedPath) {
            throw new Error('Build run is not a successful manual run of the approved private Delivery workflow on main.');
          }
          const sourceComparison = await api(`/repos/${owner}/${repo}/compare/${sourceSha}...main`);
          if (sourceComparison.merge_base_commit?.sha !== sourceSha) throw new Error('Selected application source is not an ancestor of Delivery main.');
          const workflowComparison = await api(`/repos/${owner}/${repo}/compare/${run.head_sha}...main`);
          if (workflowComparison.merge_base_commit?.sha !== run.head_sha) throw new Error('Build workflow definition is not from Delivery main.');
          const artifactName = `courier-unsigned-${sourceSha}`;
          const artifacts = await api(`/repos/${owner}/${repo}/actions/runs/${runId}/artifacts?per_page=100`);
          const matches = (artifacts.artifacts ?? []).filter((item) => item.name === artifactName && !item.expired && item.workflow_run?.id === Number(runId));
          if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest ?? '')) throw new Error('Expected one unexpired, digest-pinned candidate artifact from this run.');
          const contents = await api(`/repos/${owner}/${repo}/contents/android/app/build.gradle.kts?ref=${sourceSha}`);
          const buildFile = Buffer.from(contents.content, 'base64').toString('utf8');
          const capture = (pattern, label) => {
            const match = buildFile.match(pattern);
            if (!match) throw new Error(`Selected source lacks a unique ${label}.`);
            return match[1];
          };
          const packageName = capture(/applicationId\s*=\s*"([^"]+)"/, 'application ID');
          const versionCode = Number(capture(/versionCode\s*=\s*(\d+)/, 'versionCode'));
          const versionName = capture(/versionName\s*=\s*"([^"]+)"/, 'versionName');
          if (packageName !== 'com.linago.courier' || !Number.isSafeInteger(versionCode) || versionCode < 1) throw new Error('Selected source has an unexpected Courier identity or version.');
          await appendFile(process.env.GITHUB_OUTPUT, `version_code=${versionCode}\nversion_name=${versionName}\nartifact_name=${artifactName}\nbuild_workflow_sha=${run.head_sha}\nbuild_run_attempt=${run.run_attempt}\n`);
          process.stdout.write('Private build provenance and selected-source identity verified.\n');
          NODE

      - name: Download only the verified private-run candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          repository: linagodelivery/Delivery
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ steps.delivery-token.outputs.token }}
          path: ${{ runner.temp }}/courier-candidate
          digest-mismatch: error

      - name: Install Java 21 for trusted bundle inspection
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and pin Bundletool
        shell: bash
        run: |
          set -euo pipefail
          bundletool_version='1.18.3'
          bundletool_sha256='a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
          bundletool="$RUNNER_TEMP/bundletool-all-${bundletool_version}.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar" \
            --output "$bundletool"
          echo "${bundletool_sha256}  ${bundletool}" | sha256sum --check --status

      - name: Validate unsigned AAB before requesting Google credentials
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_WORKFLOW_SHA: ${{ steps.source.outputs.build_workflow_sha }}
          BUILD_RUN_ATTEMPT: ${{ steps.source.outputs.build_run_attempt }}
          EXPECTED_VERSION_CODE: ${{ steps.source.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.source.outputs.version_name }}
        run: |
          set -euo pipefail
          result="$(node release-controller/scripts/verify-courier-unsigned-candidate.mjs \
            "$RUNNER_TEMP/courier-candidate" "$SOURCE_SHA" "$BUILD_RUN_ID" \
            "$BUILD_WORKFLOW_SHA" "$BUILD_RUN_ATTEMPT" \
            "$EXPECTED_VERSION_CODE" "$EXPECTED_VERSION_NAME" \
            "$RUNNER_TEMP/bundletool-all-1.18.3.jar")"
          echo "$result" > "$RUNNER_TEMP/courier-candidate-verification.json"
          echo 'Candidate digest, package, version, structure, unsigned state, and Bundletool validation passed.'

      - name: Authenticate to the existing Courier WIF identity after validation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: deliveryapp-2b7a4
          workload_identity_provider: projects/581390628800/locations/global/workloadIdentityPools/github-release-pool/providers/github-delivery
          service_account: gha-courier-sign@deliveryapp-2b7a4.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          cleanup_credentials: true

      - name: Verify the expected temporary Google identity
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: deliveryapp-2b7a4
          version: '515.0.0'

      - name: Complete signing-boundary dry run without retrieving secrets
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          actual="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          expected='gha-courier-sign@deliveryapp-2b7a4.iam.gserviceaccount.com'
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected Google Cloud principal.' >&2
            exit 1
          fi
          echo "Preflight passed for source ${SOURCE_SHA} and build run ${BUILD_RUN_ID}; no signing operation or Secret Manager read was performed."

      - name: Remove candidate and temporary tool files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/courier-candidate" "$RUNNER_TEMP/courier-candidate-verification.json" "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
